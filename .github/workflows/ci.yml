name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install published API reference
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,reference,onnx]' 'rfdetr[train]==1.11.2' 'torchmetrics[detection]==1.8.2'
          python -m pip check
      - name: Require reference comparisons to execute
        run: |
          python scripts/run_reference_tests.py tests/test_public_evaluation.py \
            tests/test_f1_metrics.py tests/test_export.py tests/test_precision_reference.py \
            tests/test_public_precision.py tests/test_keypoint_accumulation.py \
            tests/test_evaluation_lifecycle_reference.py tests/test_pretrained_bootstrap_reference.py -q
  dependency-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install declared runtime floors
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c scripts/constraints-min.txt '.[dev]'
          python -m pip check
      - name: Exercise installed public workflows at dependency floors
        run: |
          cd "$RUNNER_TEMP"
          python -c 'import rfdetr_jax; assert "site-packages" in rfdetr_jax.__file__'
          python -c 'from torch.utils.tensorboard import SummaryWriter; w = SummaryWriter("events"); w.add_scalar("loss", 1.0, 0); w.close()'
          python -m pytest -c /dev/null --import-mode=importlib -p no:cacheprovider \
            -o tmp_path_retention_policy=failed -o tmp_path_retention_count=1 \
            "$GITHUB_WORKSPACE/tests/test_public_api.py" "$GITHUB_WORKSPACE/tests/test_prediction.py" \
            "$GITHUB_WORKSPACE/tests/test_api_training.py" "$GITHUB_WORKSPACE/tests/test_checkpoints.py" \
            "$GITHUB_WORKSPACE/tests/test_public_evaluation_wiring.py" "$GITHUB_WORKSPACE/tests/test_drop_path.py" \
            "$GITHUB_WORKSPACE/tests/test_public_precision.py" "$GITHUB_WORKSPACE/tests/test_loss_scaling.py" \
            "$GITHUB_WORKSPACE/tests/test_attention.py" "$GITHUB_WORKSPACE/tests/test_training_device_placement.py" \
            "$GITHUB_WORKSPACE/tests/test_evaluation_lifecycle.py" \
            "$GITHUB_WORKSPACE/tests/test_training_bootstrap.py" -q
  cpu-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint, repository checks and CPU tests
        env:
          PYTEST_ADDOPTS: --basetemp=${{ runner.temp }}/rfdetr-source-tests
        run: make gate
      - name: Remove completed source-test temporary files
        run: |
          python -c 'import os, pathlib, shutil; shutil.rmtree(pathlib.Path(os.environ["RUNNER_TEMP"]) / "rfdetr-source-tests")'
      - name: Build distributions
        run: python -m build
      - name: Inspect distributions
        run: python scripts/check_distributions.py dist
      - name: Exercise installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-cache-dir dist/*.whl pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/rfdetr-jax-train" --help
          "$RUNNER_TEMP/wheel-env/bin/rfdetr-jax-convert" --help
          "$RUNNER_TEMP/wheel-env/bin/rfdetr-jax-eval" --help
          "$RUNNER_TEMP/wheel-env/bin/rfdetr-jax-predict" --help
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'import rfdetr_jax; assert "site-packages" in rfdetr_jax.__file__'
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest -c /dev/null --import-mode=importlib \
            -o tmp_path_retention_policy=failed -o tmp_path_retention_count=1 \
            "$GITHUB_WORKSPACE/tests/test_cli.py" "$GITHUB_WORKSPACE/tests/test_inference.py" \
            "$GITHUB_WORKSPACE/tests/test_public_api.py" "$GITHUB_WORKSPACE/tests/test_api_training.py" \
            "$GITHUB_WORKSPACE/tests/test_public_precision.py" "$GITHUB_WORKSPACE/tests/test_loss_scaling.py" \
            "$GITHUB_WORKSPACE/tests/test_training_device_placement.py" \
            "$GITHUB_WORKSPACE/tests/test_evaluation_lifecycle.py" \
            "$GITHUB_WORKSPACE/tests/test_training_bootstrap.py" -q
